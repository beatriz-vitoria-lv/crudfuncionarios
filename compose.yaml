services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crud_funcionarios
      POSTGRES_USER: crud_user
      POSTGRES_PASSWORD: crud_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crud_user -d crud_funcionarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://crud_user:crud_password@db:5432/crud_funcionarios
      SECRET_KEY: chave-local-desenvolvimento
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
