<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRUD de Funcionários{% endblock %}</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#243047;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0}.container{max-width:900px;margin:42px auto;padding:0 18px}
    header{background:#173b70;color:white;padding:22px 0}header .container{margin:0 auto}
    h1{margin:0;font-size:1.65rem}.panel{background:white;border-radius:12px;padding:24px;margin-top:24px;box-shadow:0 4px 18px #162b4d12}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{display:inline-block;padding:10px 15px;border:0;border-radius:7px;background:#1d5da8;color:white;text-decoration:none;cursor:pointer;font-size:.95rem}
    .btn.secondary{background:#64748b}.btn.danger{background:#b42318}.flash{padding:12px;border-radius:7px;margin:12px 0}.sucesso{background:#e7f7ed;color:#17663a}.erro{background:#fff0ed;color:#9b2518}
    table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e6eaf0}th{color:#53627a}
    label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:1rem}
    .muted{color:#64748b}.inline{display:inline}
    @media(max-width:600px){.panel{padding:16px}td,th{padding:10px 5px;font-size:.9rem}.container{margin:24px auto}}
  </style>
</head>
<body>
<header><div class="container"><h1>CRUD de Funcionários</h1></div></header>
<main class="container">
  {% with mensagens = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensagem in mensagens %}<div class="flash {{ categoria }}">{{ mensagem }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
